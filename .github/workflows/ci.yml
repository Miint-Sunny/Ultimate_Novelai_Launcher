# CI 全部手动触发（workflow_dispatch）：push 不再自动跑任何 job。
# 节奏：改完一个（或一批）问题 → 批量推送 → 在 tip 上手动出一次 CI。
#
# 分级：
#   quick   ~5-6 分钟   Python+前端全门禁 + PyInstaller 冒烟（默认，日常用）
#   full    ~15 分钟    quick + Rust 套件（rustsec/fmt/clippy/check/test）
#                       —— src-tauri 或 Rust 依赖有改动时才需要
#   package             full + 三平台打包，安装包留成产物 —— 发布前专用。
#
# 仓库公开之后，标准 runner 的用量是免费的，所以 package 不再只打 Windows：
# 原先 macOS 留在开发机本地跑，是因为私有仓 macOS runner 计费 10 倍（windows 2x /
# ubuntu 1x）。那条约束没有了，三平台一起出，发布时不用再手工补包。
# 三个 job 并行，互不 fail-fast：一个平台挂掉不影响另外两个出产物。
name: CI

on:
  workflow_dispatch:
    inputs:
      level:
        description: "quick=Python/前端+打包冒烟(~5分) | full=+Rust套件(~15分) | package=+三平台安装包(公开仓免费)"
        type: choice
        options: [quick, full, package]
        default: quick

permissions:
  contents: read

# 同 ref 重复触发时取消旧 run，避免叠着计费。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      checks: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI_LEVEL: ${{ inputs.level || 'quick' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.11"
          version: "0.12.13"

      - run: uv sync --frozen --group dev
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: uv run --frozen --group dev pip-audit --strict
      - run: npm run lint:python
      - run: npm run typecheck:python
      - run: npm run test:python
      - run: npm run check:api-contract
      - run: npm run build
      - run: npm run scan:secrets
      - run: npm run build:sidecar
      - run: node scripts/smoke-sidecar.mjs
      - run: git diff --check

      # ---- Rust 套件：实测占 validate 约 12/14 分钟，而 src-tauri 极少变动。
      # ---- quick 跳过；src-tauri/Cargo 有改动时用 full 跑。
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        if: env.CI_LEVEL != 'quick'
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        if: env.CI_LEVEL != 'quick'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
      - name: Install Tauri Linux build dependencies
        if: env.CI_LEVEL != 'quick'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
        if: env.CI_LEVEL != 'quick'
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
        if: env.CI_LEVEL != 'quick'
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
        if: env.CI_LEVEL != 'quick'
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
        if: env.CI_LEVEL != 'quick'

  package-smoke:
    # 仅 level=package（发布前）才跑。三平台各出一份安装包。
    if: inputs.level == 'package'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos-arm64
          - os: ubuntu-latest
            label: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.11"
          version: "0.12.13"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install Tauri Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: uv sync --frozen --group dev
      - run: npm ci
      - run: npm run desktop:build
        env:
          ULTIMATE_NOVELAI_LAUNCHER_MOCK_GENERATION: "1"
      - run: node scripts/smoke-sidecar.mjs
      # 装好的包原本当场就扔掉了：这个 job 只证明编得过，拿不到能发给人的安装包。
      # 开发机是 macOS，交叉编译到别的平台走不通，所以安装包只能从这里出——
      # 构建成功就把它留下，下载即可分发。各平台的 bundle 目录不同，一并列出，
      # 不存在的路径由 upload-artifact 自行跳过。
      #
      # 注意：这些包都**没有签名**。macOS 上 Gatekeeper 会拦（用户需要
      # `xattr -dr com.apple.quarantine <app>`），Windows 会弹 SmartScreen。
      # 要去掉这些提示得有开发者证书，不是 CI 能解决的事。
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
      # sidecar 是 onedir 目录,作为 Tauri 资源进包(Tauri 会把里面的符号链接展开成实体文件)。
      # 上面的冒烟跑的是 build/ 里的原件;这里拆开**用户拿到的安装包**,用包里那一份再跑一遍,
      # 证明目录结构和可执行位都保住了。放在上传之后:路径万一对不上,也不耽误出包。
      - name: Smoke the sidecar shipped inside the installer
        shell: bash
        run: |
          out="$RUNNER_TEMP/unpacked"
          case "$RUNNER_OS" in
            macOS)
              exe="$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)/Contents/Resources/sidecar/ultimate-novelai-sidecar" ;;
            Linux)
              dpkg-deb -x "$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)" "$out"
              exe="$(find "$out" -type f -path '*/sidecar/ultimate-novelai-sidecar' | head -1)" ;;
            Windows)
              7z x -y -o"$out" "$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)" > /dev/null
              exe="$(find "$out" -type f -path '*/sidecar/ultimate-novelai-sidecar.exe' | head -1)" ;;
          esac
          if [ -z "$exe" ] || [ ! -e "$exe" ]; then echo "sidecar not found inside the installer"; exit 1; fi
          echo "smoking $exe"
          node scripts/smoke-sidecar.mjs "$exe"
