# CI 全部手动触发（workflow_dispatch）：push 不再自动跑任何 job。
# 节奏：改完一个（或一批）问题 → 批量推送 → 在 tip 上手动出一次 CI。
#
# 分级与实测计费（ubuntu 1x / windows 2x / macOS 10x）：
#   quick   ~5-6 分钟   Python+前端全门禁 + PyInstaller 冒烟（默认，日常用）
#   full    ~15 分钟    quick + Rust 套件（rustsec/fmt/clippy/check/test）
#                       —— src-tauri 或 Rust 依赖有改动时才需要
#   package ~40 计费分钟 full + Windows 打包冒烟 —— 发布前专用。
#                       macOS 打包冒烟在开发机本地跑（macOS runner 计费 10 倍）：
#                       ULTIMATE_NOVELAI_LAUNCHER_MOCK_GENERATION=1 npm run desktop:build
#                       && node scripts/smoke-sidecar.mjs
#
# 60 分钟/月的预算参考：约 8 次 quick + 1 次 full；package 不走月度预算。
name: CI

on:
  workflow_dispatch:
    inputs:
      level:
        description: "quick=Python/前端+打包冒烟(~5分) | full=+Rust套件(~15分) | package=+macOS/Windows打包(计费~80分)"
        type: choice
        options: [quick, full, package]
        default: quick

permissions:
  contents: read

# 同 ref 重复触发时取消旧 run，避免叠着计费。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      checks: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI_LEVEL: ${{ inputs.level || 'quick' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.11"
          version: "0.11.18"

      - run: uv sync --frozen --group dev
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: uv run --frozen --group dev pip-audit --strict
      - run: npm run lint:python
      - run: npm run typecheck:python
      - run: npm run test:python
      - run: npm run check:api-contract
      - run: npm run build
      - run: npm run scan:secrets
      - run: npm run build:sidecar
      - run: node scripts/smoke-sidecar.mjs
      - run: git diff --check

      # ---- Rust 套件：实测占 validate 约 12/14 分钟，而 src-tauri 极少变动。
      # ---- quick 跳过；src-tauri/Cargo 有改动时用 full 跑。
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        if: env.CI_LEVEL != 'quick'
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        if: env.CI_LEVEL != 'quick'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
      - name: Install Tauri Linux build dependencies
        if: env.CI_LEVEL != 'quick'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
        if: env.CI_LEVEL != 'quick'
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
        if: env.CI_LEVEL != 'quick'
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
        if: env.CI_LEVEL != 'quick'
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
        if: env.CI_LEVEL != 'quick'

  package-smoke:
    # 仅 level=package（发布前）才跑，且只跑 Windows（2 倍计费）：
    # macOS 打包冒烟在开发机本地跑（tauri build + smoke-sidecar，免费且更快），
    # macOS runner 计费 10 倍，不再上云。
    if: inputs.level == 'package'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.11"
          version: "0.11.18"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - run: uv sync --frozen --group dev
      - run: npm ci
      - run: npm run desktop:build
        env:
          ULTIMATE_NOVELAI_LAUNCHER_MOCK_GENERATION: "1"
      - run: node scripts/smoke-sidecar.mjs
