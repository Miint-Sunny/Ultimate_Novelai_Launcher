[package]
name = "ultimate_novelai_launcher"
version = "0.1.0"
description = "Ultimate Novelai launcher desktop shell over the refactored reference UI"
authors = ["Ultimate Novelai launcher Contributors"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.88"

[lib]
name = "ultimate_novelai_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
